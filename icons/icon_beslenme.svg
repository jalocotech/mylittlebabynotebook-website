<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <title>Beslenme - Biberon, pompa ve sağma poşetleri</title>
  <desc>My Little Baby Notebook - Beslenme menü ikonu</desc>

  <g transform="translate(120, 120)">
    <!-- Sparkles -->
    <path d="M -80 -70 L -78 -65 L -73 -67 L -78 -64 L -80 -59 L -82 -64 L -87 -67 L -82 -65 Z" fill="#FFE9A0"/>
    <path d="M 80 50 L 82 55 L 87 53 L 82 56 L 80 61 L 78 56 L 73 53 L 78 55 Z" fill="#FFE9A0"/>
    <circle cx="75" cy="-50" r="3" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="-70" cy="45" r="2.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="-80" cy="-10" r="2" fill="#FFFFFF" opacity="0.7"/>

    <!-- BREAST PUMP (back-left) -->
    <g transform="translate(-42, 0)">
      <ellipse cx="0" cy="58" rx="30" ry="4" fill="#3E2A1F" opacity="0.1"/>

      <!-- Collection bottle -->
      <path d="M -18 8 Q -18 3 -14 3 L 14 3 Q 18 3 18 8 L 18 50 Q 18 56 12 56 L -12 56 Q -18 56 -18 50 Z" fill="#FFFFFF"/>
      <!-- Milk inside -->
      <path d="M -16 25 L 16 25 L 16 48 Q 16 54 11 54 L -11 54 Q -16 54 -16 48 Z" fill="#FFF4D4"/>
      <!-- Measurement marks -->
      <line x1="-15" y1="33" x2="-10" y2="33" stroke="#E8B766" stroke-width="0.7"/>
      <line x1="-15" y1="41" x2="-10" y2="41" stroke="#E8B766" stroke-width="0.7"/>
      <line x1="-15" y1="49" x2="-10" y2="49" stroke="#E8B766" stroke-width="0.7"/>

      <!-- Funnel connector -->
      <path d="M -20 3 L -24 -5 Q -24 -9 -20 -9 L 20 -9 Q 24 -9 24 -5 L 20 3 Z" fill="#F4C0D1"/>
      <!-- Upper funnel cone -->
      <path d="M -24 -9 Q -26 -18 -18 -26 L 18 -26 Q 26 -18 24 -9 Z" fill="#FFD4E0"/>
      <!-- Funnel top -->
      <ellipse cx="0" cy="-26" rx="18" ry="3" fill="#ED93B1"/>
      <ellipse cx="0" cy="-26" rx="14" ry="2" fill="#F4C0D1"/>

      <!-- Motor button -->
      <circle cx="22" cy="-3" r="4" fill="#FFFFFF"/>
      <circle cx="22" cy="-3" r="2.5" fill="#ED93B1"/>

      <!-- Tube -->
      <path d="M 22 -3 Q 32 -3 36 4 Q 40 12 35 18" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- BOTTLE (center-front) -->
    <g transform="translate(-5, 18)">
      <ellipse cx="0" cy="52" rx="14" ry="3" fill="#3E2A1F" opacity="0.12"/>

      <!-- Nipple -->
      <ellipse cx="0" cy="-38" rx="6.5" ry="3.5" fill="#F9D48B"/>
      <rect x="-4.5" y="-40" width="9" height="2.5" rx="1" fill="#E8B766"/>
      <!-- Collar ring -->
      <rect x="-10" y="-32" width="20" height="5" rx="2" fill="#FFFFFF"/>
      <rect x="-10" y="-32" width="20" height="5" rx="2" fill="none" stroke="#E8B766" stroke-width="0.5"/>
      <!-- Body -->
      <path d="M -11 -26 Q -11 -30 -9 -30 L 9 -30 Q 11 -30 11 -26 L 11 42 Q 11 46 7 46 L -7 46 Q -11 46 -11 42 Z" fill="#FFFFFF"/>
      <!-- Milk -->
      <path d="M -10 -8 L 10 -8 L 10 40 Q 10 44 6 44 L -6 44 Q -10 44 -10 40 Z" fill="#FFF9ED"/>
      <!-- Measurement -->
      <line x1="-8" y1="5" x2="-4" y2="5" stroke="#D4A574" stroke-width="0.7"/>
      <line x1="-8" y1="15" x2="-4" y2="15" stroke="#D4A574" stroke-width="0.7"/>
      <line x1="-8" y1="25" x2="-4" y2="25" stroke="#D4A574" stroke-width="0.7"/>
      <!-- Bear face -->
      <g transform="translate(2, 20)">
        <circle cx="-3" cy="-2" r="1.5" fill="#F4C088"/>
        <circle cx="3" cy="-2" r="1.5" fill="#F4C088"/>
        <circle cx="0" cy="2" r="4" fill="#F4C088"/>
        <circle cx="-1.2" cy="1" r="0.5" fill="#3E2A1F"/>
        <circle cx="1.2" cy="1" r="0.5" fill="#3E2A1F"/>
        <ellipse cx="0" cy="3" rx="1" ry="0.6" fill="#A67043"/>
      </g>
    </g>

    <!-- MILK STORAGE BAGS (right) -->
    <!-- Back bag (tilted) -->
    <g transform="translate(55, 22) rotate(8)">
      <ellipse cx="0" cy="40" rx="18" ry="3" fill="#3E2A1F" opacity="0.08"/>

      <path d="M -18 -28 L 18 -28 L 18 32 Q 18 40 12 40 L -12 40 Q -18 40 -18 32 Z" fill="#FFFFFF" opacity="0.85"/>
      <path d="M -18 -28 L 18 -28 L 18 32 Q 18 40 12 40 L -12 40 Q -18 40 -18 32 Z" fill="none" stroke="#B8DDC9" stroke-width="1.2"/>

      <!-- Zipper top -->
      <rect x="-18" y="-30" width="36" height="4" rx="1" fill="#B8DDC9"/>
      <line x1="-14" y1="-28" x2="14" y2="-28" stroke="#5FA584" stroke-width="0.5" stroke-dasharray="1 1"/>

      <!-- Milk -->
      <path d="M -16 -5 L 16 -5 L 16 30 Q 16 38 11 38 L -11 38 Q -16 38 -16 30 Z" fill="#FFF4D4" opacity="0.85"/>

      <!-- ml marks -->
      <line x1="-14" y1="5" x2="-10" y2="5" stroke="#5FA584" stroke-width="0.6"/>
      <line x1="-14" y1="15" x2="-10" y2="15" stroke="#5FA584" stroke-width="0.6"/>
      <line x1="-14" y1="25" x2="-10" y2="25" stroke="#5FA584" stroke-width="0.6"/>

      <!-- Date label -->
      <rect x="-10" y="-20" width="20" height="10" rx="1" fill="#FFFFFF"/>
      <line x1="-8" y1="-15" x2="8" y2="-15" stroke="#B8DDC9" stroke-width="0.5"/>
      <line x1="-8" y1="-12" x2="5" y2="-12" stroke="#B8DDC9" stroke-width="0.5"/>

      <!-- Droplet -->
      <path d="M 0 15 Q -3 12 -3 9 Q -3 6 0 6 Q 3 6 3 9 Q 3 12 0 15 Z" fill="#B8DDE8" opacity="0.7"/>
    </g>

    <!-- Front bag -->
    <g transform="translate(48, 15)">
      <ellipse cx="0" cy="42" rx="18" ry="3" fill="#3E2A1F" opacity="0.1"/>

      <path d="M -18 -28 L 18 -28 L 18 32 Q 18 40 12 40 L -12 40 Q -18 40 -18 32 Z" fill="#FFFFFF"/>
      <path d="M -18 -28 L 18 -28 L 18 32 Q 18 40 12 40 L -12 40 Q -18 40 -18 32 Z" fill="none" stroke="#B8DDC9" stroke-width="1.2"/>

      <!-- Zipper with handles -->
      <rect x="-18" y="-31" width="36" height="5" rx="1.5" fill="#B8DDC9"/>
      <circle cx="-18" cy="-28.5" r="1.5" fill="#5FA584"/>
      <circle cx="18" cy="-28.5" r="1.5" fill="#5FA584"/>
      <line x1="-14" y1="-28.5" x2="14" y2="-28.5" stroke="#5FA584" stroke-width="0.5" stroke-dasharray="1 1"/>

      <!-- Milk -->
      <path d="M -16 -3 L 16 -3 L 16 30 Q 16 38 11 38 L -11 38 Q -16 38 -16 30 Z" fill="#FFF9ED"/>

      <!-- Scale -->
      <line x1="-14" y1="8" x2="-9" y2="8" stroke="#5FA584" stroke-width="0.7"/>
      <line x1="-14" y1="18" x2="-9" y2="18" stroke="#5FA584" stroke-width="0.7"/>
      <line x1="-14" y1="28" x2="-9" y2="28" stroke="#5FA584" stroke-width="0.7"/>

      <!-- Date label -->
      <rect x="-11" y="-21" width="22" height="11" rx="1.5" fill="#E0F0E5"/>
      <line x1="-9" y1="-16" x2="9" y2="-16" stroke="#5FA584" stroke-width="0.5"/>
      <line x1="-9" y1="-13" x2="6" y2="-13" stroke="#5FA584" stroke-width="0.5"/>

      <!-- Droplet -->
      <g transform="translate(0, 18)">
        <path d="M 0 6 Q -4 3 -4 -1 Q -4 -5 0 -5 Q 4 -5 4 -1 Q 4 3 0 6 Z" fill="#B8DDE8"/>
        <ellipse cx="-1" cy="-1" rx="1" ry="1.5" fill="#FFFFFF" opacity="0.7"/>
      </g>
    </g>
  </g>
</svg>
