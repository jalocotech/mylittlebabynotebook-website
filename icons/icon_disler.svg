<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <title>Dişler - Gülümseyen diş karakteri</title>
  <desc>My Little Baby Notebook - Dişler menü ikonu</desc>

  <g transform="translate(120, 110)">
    <!-- Sparkles -->
    <path d="M -60 -50 L -58 -45 L -53 -47 L -58 -44 L -60 -39 L -62 -44 L -67 -47 L -62 -45 Z" fill="#FFE9A0"/>
    <path d="M 65 -40 L 67 -35 L 72 -37 L 67 -34 L 65 -29 L 63 -34 L 58 -37 L 63 -35 Z" fill="#FFE9A0"/>
    <circle cx="-50" cy="30" r="2.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="55" cy="35" r="3" fill="#FFFFFF" opacity="0.8"/>

    <!-- Main tooth (cute, with face) -->
    <g transform="translate(-10, 0)">
      <ellipse cx="0" cy="48" rx="30" ry="4" fill="#3E2A1F" opacity="0.1"/>

      <!-- Tooth shape -->
      <path d="M -28 -35
               Q -30 -40 -20 -42
               Q -10 -44 0 -42
               Q 10 -44 20 -42
               Q 30 -40 28 -35
               Q 28 -10 22 10
               Q 18 28 12 38
               Q 6 45 0 42
               Q -6 45 -12 38
               Q -18 28 -22 10
               Q -28 -10 -28 -35 Z"
               fill="#FFF3E8"/>
      <!-- Subtle shading -->
      <path d="M -25 -32
               Q -27 -38 -18 -40
               Q -10 -41 -2 -40
               Q 0 -25 -3 0
               Q -6 20 -10 32
               Q -14 38 -18 32
               Q -22 20 -25 0
               Q -28 -20 -25 -32 Z"
               fill="#FFF9F0" opacity="0.8"/>

      <!-- Cute face -->
      <g transform="translate(0, -8)">
        <!-- Eyes (closed, happy) -->
        <path d="M -10 0 Q -7 -3 -4 0" stroke="#3E2A1F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M 4 0 Q 7 -3 10 0" stroke="#3E2A1F" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- Cheeks -->
        <ellipse cx="-12" cy="7" rx="3" ry="2" fill="#F8B4C4" opacity="0.7"/>
        <ellipse cx="12" cy="7" rx="3" ry="2" fill="#F8B4C4" opacity="0.7"/>
        <!-- Smile -->
        <path d="M -4 7 Q 0 11 4 7" stroke="#3E2A1F" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>

      <!-- Shine highlight -->
      <ellipse cx="-15" cy="-20" rx="3" ry="6" fill="#FFFFFF" opacity="0.85" transform="rotate(-20 -15 -20)"/>
    </g>

    <!-- Smaller second tooth -->
    <g transform="translate(30, 15) scale(0.55)">
      <ellipse cx="0" cy="48" rx="30" ry="4" fill="#3E2A1F" opacity="0.08"/>
      <path d="M -28 -35
               Q -30 -40 -20 -42
               Q -10 -44 0 -42
               Q 10 -44 20 -42
               Q 30 -40 28 -35
               Q 28 -10 22 10
               Q 18 28 12 38
               Q 6 45 0 42
               Q -6 45 -12 38
               Q -18 28 -22 10
               Q -28 -10 -28 -35 Z"
               fill="#FFF3E8"/>
    </g>

    <!-- Toothbrush at the bottom -->
    <g transform="translate(-10, 55) rotate(-15)" opacity="0.95">
      <rect x="-22" y="-3" width="36" height="6" rx="2" fill="#F4C0D1"/>
      <rect x="14" y="-5" width="10" height="10" rx="2" fill="#FFF3E8"/>
      <!-- Bristles -->
      <line x1="15" y1="-4" x2="15" y2="-7" stroke="#B8DDC9" stroke-width="1"/>
      <line x1="17" y1="-4" x2="17" y2="-8" stroke="#B8DDC9" stroke-width="1"/>
      <line x1="19" y1="-4" x2="19" y2="-7" stroke="#B8DDC9" stroke-width="1"/>
      <line x1="21" y1="-4" x2="21" y2="-8" stroke="#B8DDC9" stroke-width="1"/>
      <line x1="23" y1="-4" x2="23" y2="-7" stroke="#B8DDC9" stroke-width="1"/>
    </g>
  </g>
</svg>
